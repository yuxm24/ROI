[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zwam-client"
version = "0.1.0"
description = "Zerith VA HTTP protocol and policy client"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
zwam = "zwam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["zwam*"]
